<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | EduAttend</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-login-body">

  <div class="login-card">
    <div class="login-header">
      <div class="login-badge-icon">🛡️</div>
      <h2>Administrator Login</h2>
      <p>admin login </p>
    </div>

    <!-- Alert Box -->
    <div id="loginAlert" class="status-card closed" style="display: none; padding: 12px; margin-bottom: 20px; font-size: 0.875rem;">
    </div>

    <form id="adminLoginForm">
      <div class="form-group">
        <label for="adminUsername" class="form-label">Username</label>
        <input
          type="text"
          id="adminUsername"
          class="form-input"
          placeholder="admin"
          required
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label for="adminPassword" class="form-label">Password</label>
        <input
          type="password"
          id="adminPassword"
          class="form-input"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" id="btnLoginSubmit" class="btn-portal btn-primary" style="margin-top: 10px;">
        Login to Dashboard
      </button>
    </form>

    <div style="margin-top: 24px; text-align: center; font-size: 0.85rem; color: var(--slate-500); display: flex; flex-direction: column; gap: 8px;">
      <a href="index.html" style="color: var(--slate-600);">&larr; Back to Portal Selection</a>
      <button type="button" id="btnConfigApiUrl" style="background: none; border: none; color: var(--primary); font-size: 0.78rem; cursor: pointer; text-decoration: underline;">
        ⚙️ Configure Web App API URL
      </button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
